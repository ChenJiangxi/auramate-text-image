<div class="body">
  <p>向内求，本来是件好事。可一旦过了头，就成了没完没了的自我审判——把系统的、时运的、别人的问题，一股脑收进自己身上，判自己有罪。</p>
  <p>命理给你的，从来不是一张免罪符，让你把责任推给命。它给的是一个坐标：让你在最难、最想骂自己的那一刻，抬头看一眼——哦，我这会儿正站在低处，这段本来就难，它会过去。</p>
  <p class="last">低谷这东西，说到底不是你坏了，是你正走在一段低的运里。这条线迟早会拐头往上。你要做的，只是别在最难的时候，还亲手判自己有罪。</p>
</div>
<div class="foot"><span>灵伴 AI · AURAMATE</span><span>auramate.net</span></div>

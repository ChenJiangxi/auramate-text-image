<div class="kicker">低谷期 · 02</div>
<div class="body">
  <p>后来我慢慢想明白：他不是不会反省，是反省的时候，手里没有一把<span class="em">尺子</span>。没有尺子，他就量不出来——眼前这件坏事，几分是我的问题，几分是这段日子本来就难。</p>
  <p>少了这把尺子，剩下的就只能全算到自己头上。所以我做了个东西，叫人生 K 线：拿你的八字，把你这一辈子的运势，画成一条有涨有跌的线。</p>
  <p>哪几年往上走，哪几年本来就低，清清楚楚摆在你面前。它不替你开脱什么，只是让你看见——你现在正踩着的这个坑，在整条线里，是有它的位置的。</p>
</div>
<div class="foot"><span>灵伴 AI · AURAMATE</span><span>auramate.net</span></div>

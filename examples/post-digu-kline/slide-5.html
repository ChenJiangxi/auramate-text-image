<!doctype html><html><head><meta charset=utf-8><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;font-family:'Noto Serif SC',serif;color:#2b2620;overflow:hidden;}
.frame{width:100%;height:100%;padding:92px 96px 78px;display:flex;flex-direction:column;background:linear-gradient(108deg,#e4dbee 0%,#ebe1ea 38%,#f1e7de 66%,#f6e5d6 100%);}
.kicker{font-family:'Noto Sans SC',sans-serif;font-size:26px;font-weight:500;letter-spacing:0.2em;color:#9b8ea8;}
.head{font-size:52px;font-weight:900;line-height:1.34;color:#1e1824;margin-top:20px;}
.head .em{color:#7a5a8a;}
.shotwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:24px;}
.shot{height:100%;border-radius:30px;overflow:hidden;border:1px solid rgba(90,70,95,0.28);box-shadow:0 22px 54px rgba(60,40,70,0.28);}
.shot img{height:100%;display:block;}
.foot{margin-top:24px;padding-top:22px;border-top:1px solid rgba(90,70,95,0.18);display:flex;justify-content:space-between;align-items:center;font-family:'Noto Sans SC',sans-serif;font-size:26px;color:#a28f9a;letter-spacing:0.1em;}
</style></head><body><div class="frame">
<div class="kicker">低谷期 · 04</div>
<div class="head">点开那一年，<span class="em">它把起落讲给你听</span></div>
<div class="shotwrap"><div class="shot"><img src="assets/pf-detail.png"/></div></div>
<div class="foot"><span>灵伴 AI · 人生 K 线</span><span>开盘 · 收盘 · 最高 · 最低</span></div>
</div></body></html>

<div class="kicker">低谷期 · 01</div>
<div class="body">
  <p>有一种人，心思特别细，一点风吹草动都能往心里去；小时候多半还带着点没消化的委屈；可偏偏又不甘心，心里一直憋着股劲，想做成点什么。<span class="em">高敏、带旧伤、又是个野心家</span>——这三样，常常长在同一个人身上。</p>
  <p>顺的时候都还好。一到低谷就出事了：事情搞砸了，关系散了，钱也紧了。换别人，骂两句环境、怪两句运气，也就过去了。他不行。他只会往自己身上问——是不是我不够好，是不是又是我哪儿做错了。</p>
  <p>一件坏事，他能翻来覆去地嚼很久，嚼到最后，结论永远是那一个：怪我。慢慢地，什么锅都成了他的。</p>
</div>

<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 B · 浅底卡片结构风 —— 内页（一张一个观点）
   图鉴自测型用这套：形态名（大字）+ 一句状态 + 真实灵体截图。
   跨 slide 排版完全一致，只换名字和句子 —— 适合脚本批量生成。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;background:#eee9f5;font-family:'Noto Sans SC','PingFang SC',sans-serif;color:#2e2740;overflow:hidden;}
.frame{width:100%;height:100%;padding:84px 80px 70px;display:flex;flex-direction:column;
  background:radial-gradient(125% 80% at 82% 6%,rgba(122,85,166,0.20) 0%,rgba(238,233,245,0) 56%),
             radial-gradient(90% 60% at 8% 96%,rgba(122,85,166,0.12) 0%,rgba(238,233,245,0) 50%),#eee9f5;}
.kicker{font-size:28px;font-weight:700;color:#7a55a6;letter-spacing:0.06em;}
.name{font-size:96px;font-weight:900;line-height:1.15;color:#2e2740;margin-top:28px;}
.name .em{color:#7a55a6;}
.state{font-size:46px;font-weight:700;color:#5f5570;line-height:1.5;margin-top:24px;}
/* 灵体要铺满，别缩成一小块留大白。
   素材是整张手机截图时先裁出光球方块（见 references/04-assets.md）。

   id="slot" 是给 tools/slide-gif.js 用的锚点：形态本来就是动的，
   图鉴自测这类内容应该出 GIF 而不是静帧。静帧只是 GIF 的 fallback。 */
.orbwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:28px;}
.orbwrap img{height:100%;width:100%;object-fit:cover;display:block;border-radius:24px;
  box-shadow:0 18px 44px rgba(72,48,92,0.22);}
.foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:26px;border-top:1px dashed #c7b8de;
  font-size:28px;font-weight:900;color:#7a55a6;letter-spacing:0.1em;}
</style></head><body><div class="frame">
<div class="kicker">{{系列名}} · {{序号}} / {{总数}}</div>
<div class="name">{{形态名}}</div>
<div class="state">{{一句具体状态，不是定义}}</div>
<div class="orbwrap" id="slot"><img src="assets/form-{{id}}.png"/></div>
<div class="foot"><span>灵伴 AI · AURAMATE</span><span>auramate.net</span></div>
</div></body></html>

<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 C · 深色压字风 —— 单张冲击封面
   ⚠️ 已被模板 A 取代，不做整套。只在用户明确要「压字风」时用。
   产品截图铺满 + 大字压上去，meme 封面式。截图必须是干净 UI（裁掉违禁词）。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;font-family:'Noto Sans SC','PingFang SC',sans-serif;overflow:hidden;}
.frame{width:100%;height:100%;padding:70px 72px 64px;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 6%,#241a33 0%,#140f1c 55%,#0d0a12 100%);color:#f5ecd9;}
.brand{font-size:26px;font-weight:700;letter-spacing:0.24em;color:#c79bec;opacity:0.85;}
.bigtext{font-size:120px;font-weight:900;line-height:1.16;letter-spacing:-0.02em;margin-top:30px;color:#f5ecd9;}
.bigtext .em{color:#c79bec;}
.shotwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:36px;}
.shot{width:100%;border-radius:20px;overflow:hidden;border:1px solid #6b4b8f;box-shadow:0 26px 60px rgba(0,0,0,0.55);}
.shot img{width:100%;display:block;}
.foot{padding-top:22px;font-size:26px;letter-spacing:0.14em;color:#9b86b5;display:flex;justify-content:space-between;}
</style></head><body><div class="frame">
<div class="brand">灵伴 AI · AURAMATE</div>
<div class="bigtext">{{大字第一行}}<br/><span class="em">{{大字第二行}}</span></div>
<div class="shotwrap"><div class="shot"><img src="assets/shot.png"/></div></div>
<div class="foot"><span>auramate.net</span><span>{{标注}}</span></div>
</div></body></html>

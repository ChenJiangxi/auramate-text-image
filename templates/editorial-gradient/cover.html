<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 A · 渐变编辑风 —— 封面页
   字号：短标题 82 / 长标题 66-68。手动 <br/> 断行，别拆词。
   配图 codex-image 生成，放下半。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;font-family:'Noto Serif SC','Songti SC',serif;color:#2b2620;overflow:hidden;}
.frame{width:100%;height:100%;padding:92px 96px 78px;display:flex;flex-direction:column;
  background:linear-gradient(108deg,#e4dbee 0%,#ebe1ea 38%,#f1e7de 66%,#f6e5d6 100%);}
.kicker{font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;font-weight:500;letter-spacing:0.2em;color:#9b8ea8;}
.title{font-size:68px;font-weight:900;line-height:1.36;letter-spacing:-0.01em;color:#1e1824;margin-top:26px;}
.title .em{color:#7a5a8a;}
.illo{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:12px;}
.illo img{max-height:100%;max-width:540px;display:block;border-radius:14px;}
.foot{padding-top:22px;border-top:1px solid rgba(90,70,95,0.18);display:flex;justify-content:space-between;align-items:center;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;color:#a28f9a;letter-spacing:0.1em;}
</style></head><body><div class="frame">
<div class="kicker">灵伴 AI · {{系列名}}</div>
<div class="title">{{标题第一行}}，<br/>{{标题第二行}}，<br/>{{第三行含}}<span class="em">{{accent词}}</span></div>
<div class="illo"><img src="assets/illustration.png"/></div>
<div class="foot"><span>AURAMATE</span><span>auramate.net</span></div>
</div></body></html>

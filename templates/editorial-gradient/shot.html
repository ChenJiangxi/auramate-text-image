<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 A · 渐变编辑风 —— 产品截图页
   head 52px 说明标题 + 真实产品截图卡 + foot 标注。
   截图必须完整、铺满、干净（无违禁词露出）。
   portrait 手机图 → .shot img{height:100%}（默认）
   landscape/近方图 → 改成 .shot img{width:100%;height:auto} 且 .shot{width:100%;height:auto}
   foot 右侧写数据标注（如「红涨吉 · 绿跌凶」），不是广告语。
   ⚠️ kicker/foot 用第一人称叙述，绝不写「真实产品截图」「产品 demo」。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;font-family:'Noto Serif SC','Songti SC',serif;color:#2b2620;overflow:hidden;}
.frame{width:100%;height:100%;padding:92px 96px 78px;display:flex;flex-direction:column;
  background:linear-gradient(108deg,#e4dbee 0%,#ebe1ea 38%,#f1e7de 66%,#f6e5d6 100%);}
.kicker{font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;font-weight:500;letter-spacing:0.2em;color:#9b8ea8;}
.head{font-size:52px;font-weight:900;line-height:1.34;color:#1e1824;margin-top:20px;}
.head .em{color:#7a5a8a;}
.shotwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:24px;}
.shot{height:100%;border-radius:30px;overflow:hidden;border:1px solid rgba(90,70,95,0.28);box-shadow:0 22px 54px rgba(60,40,70,0.28);}
.shot img{height:100%;display:block;}
.foot{margin-top:24px;padding-top:22px;border-top:1px solid rgba(90,70,95,0.18);display:flex;justify-content:space-between;align-items:center;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;color:#a28f9a;letter-spacing:0.1em;}
</style></head><body><div class="frame">
<div class="kicker">{{系列名}} · 03</div>
<div class="head">{{一句说明}}，<span class="em">{{accent 部分}}</span></div>
<div class="shotwrap"><div class="shot"><img src="assets/pf-chart.png"/></div></div>
<div class="foot"><span>灵伴 AI · {{功能名}}</span><span>{{数据标注}}</span></div>
</div></body></html>

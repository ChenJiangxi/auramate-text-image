<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 B · 浅底卡片结构风 —— 封面
   黑体 Noto Sans SC，weight 900/700/500 拉层级。封面大字 150（超短标题，2 行内）。
   左上角 96px 圆形灵体 badge —— 必须是真实产品截图，不准 CSS 假球。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;background:#eee9f5;font-family:'Noto Sans SC','PingFang SC',sans-serif;color:#2e2740;overflow:hidden;}
.frame{width:100%;height:100%;padding:84px 80px 70px;display:flex;flex-direction:column;
  background:radial-gradient(125% 80% at 82% 6%,rgba(122,85,166,0.20) 0%,rgba(238,233,245,0) 56%),
             radial-gradient(90% 60% at 8% 96%,rgba(122,85,166,0.12) 0%,rgba(238,233,245,0) 50%),#eee9f5;}
.kicker{display:flex;align-items:center;gap:20px;}
.orb-badge{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center 46%;
  box-shadow:0 0 0 2px #d8cce8,0 6px 22px rgba(122,85,166,0.34);flex-shrink:0;}
.kicker .label{font-size:28px;font-weight:700;color:#7a55a6;letter-spacing:0.04em;}
.kicker .label .muted{color:#8a7fa0;font-weight:500;}
.titlewrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
.head{font-size:150px;font-weight:900;line-height:1.1;letter-spacing:-0.04em;color:#2e2740;}
.head .em{color:#7a55a6;}
.sub{font-size:46px;font-weight:700;color:#5f5570;line-height:1.45;margin-top:46px;}
.sub .em{color:#7a55a6;}
.foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:26px;border-top:1px dashed #c7b8de;}
.foot .left{font-size:28px;font-weight:900;color:#7a55a6;letter-spacing:0.1em;}
.foot .right{font-size:28px;color:#7a55a6;letter-spacing:0.18em;font-weight:900;display:flex;align-items:center;gap:14px;}
.foot .right .arr{font-size:38px;}
</style></head><body><div class="frame">
<div class="kicker">
  <img class="orb-badge" src="assets/orb-dunwu.png"/>
  <div class="label">灵伴 AI <span class="muted">· 十种状态</span></div>
</div>
<div class="titlewrap">
  <div class="head">你今天<br/>是<span class="em">哪一种</span></div>
  <div class="sub">十种形态全在下面，对号入座一下。我自己最常出现的是顿悟日。</div>
</div>
<div class="foot">
  <div class="left">灵伴 AI · AURAMATE</div>
  <div class="right"><span>SWIPE</span><span class="arr">→</span></div>
</div>
</div></body></html>

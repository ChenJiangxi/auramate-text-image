<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 A · 渐变编辑风 —— 成对对比页  (2026-08-10)
   知识解析型的核心页型：两个概念并排，靠对比讲清楚区别。
   十神天然是五对（一个稳的、一个野的），一对一张，比一次列十个好读得多。

   ⚠️ 左右两张必须是**各自对应的**真实形态图，不能拿同一张图充两个角色，
      也不能随便找张好看的光球顶上 —— 图要能证明标题在说的那句话。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;font-family:'Noto Serif SC','Songti SC',serif;color:#2b2620;overflow:hidden;}
.frame{width:100%;height:100%;padding:88px 88px 74px;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(120% 90% at 10% 2%, rgba(132,98,178,0.20) 0%, rgba(255,255,255,0) 54%),
    radial-gradient(95% 72% at 98% 102%, rgba(228,152,92,0.18) 0%, rgba(255,255,255,0) 56%),
    linear-gradient(108deg,#dccfef 0%,#e7d9e9 34%,#f0e2d7 64%,#f8dcc4 100%);}
.frame::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0.42;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.18'/></svg>");}
.frame > *{position:relative;z-index:1;}
.kicker{font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;font-weight:500;letter-spacing:0.2em;color:#8d7d9e;
  padding-bottom:20px;border-bottom:1px solid rgba(90,70,95,0.16);}
.head{font-size:52px;font-weight:900;line-height:1.34;color:#1a1420;margin-top:30px;}
.head .em{color:#6b3f8f;}
.pair{flex:1;display:flex;gap:34px;min-height:0;margin-top:36px;}
.col{flex:1;display:flex;flex-direction:column;min-width:0;}
.col .pic{flex:1;min-height:0;border-radius:22px;overflow:hidden;border:1px solid rgba(90,70,95,0.24);
  box-shadow:0 16px 40px rgba(60,40,70,0.22);}
.col .pic img{width:100%;height:100%;object-fit:cover;display:block;}
.col .name{font-size:46px;font-weight:900;color:#1a1420;margin-top:26px;}
.col .name .tag{font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:24px;font-weight:500;
  color:#6b3f8f;letter-spacing:0.14em;margin-left:14px;vertical-align:0.22em;}
.col .desc{font-size:34px;line-height:1.7;color:#4a4348;margin-top:14px;}
.foot{margin-top:32px;padding-top:22px;border-top:1px solid rgba(90,70,95,0.18);display:flex;justify-content:space-between;align-items:center;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;color:#9e8a99;letter-spacing:0.1em;}
</style></head><body><div class="frame">
<div class="kicker">古人的十种状态</div>
<div class="head">同样是<span class="em">往外给</span>，古人分成两种</div>
<div class="pair">
  <div class="col">
    <div class="pic"><img src="assets/form-meishi.jpg"/></div>
    <div class="name">美食日<span class="tag">正 · 稳</span></div>
    <div class="desc">慢慢来，做点自己喜欢的事。<br/>力气是往外散的，但散得温和。</div>
  </div>
  <div class="col">
    <div class="pic"><img src="assets/form-fafeng.jpg"/></div>
    <div class="name">发疯日<span class="tag">偏 · 野</span></div>
    <div class="desc">憋不住了，非得说点什么。<br/>同样是往外，这天是炸开的。</div>
  </div>
</div>
<div class="foot"><span>灵伴 AI · 每日形态</span><span>五对之二 · 往外给</span></div>
</div></body></html>

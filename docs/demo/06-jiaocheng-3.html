<!doctype html><html><head><meta charset=utf-8><style>
/* 模板 A · 渐变编辑风 —— 产品截图页  (v2, 2026-08-10)
   head 52px 说明标题 + 真实产品截图卡 + foot 数据标注。
   截图必须完整、铺满、干净（无违禁词露出）。
   portrait 手机图 → .shot{height:100%}（默认）
   landscape/近方图 → .shot{width:100%;height:auto} + .shot img{width:100%;height:auto}
   ⚠️ kicker/foot 用第一人称叙述，绝不写「真实产品截图」「产品 demo」。 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1242px;height:1660px;font-family:'Noto Serif SC','Songti SC',serif;color:#2b2620;overflow:hidden;}
.frame{width:100%;height:100%;padding:88px 88px 74px;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(120% 90% at 10% 2%, rgba(132,98,178,0.20) 0%, rgba(255,255,255,0) 54%),
    radial-gradient(95% 72% at 98% 102%, rgba(228,152,92,0.18) 0%, rgba(255,255,255,0) 56%),
    linear-gradient(108deg,#dccfef 0%,#e7d9e9 34%,#f0e2d7 64%,#f8dcc4 100%);}
.frame::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0.42;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.18'/></svg>");}
.frame > *{position:relative;z-index:1;}
.kicker{font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;font-weight:500;letter-spacing:0.2em;color:#8d7d9e;
  padding-bottom:20px;border-bottom:1px solid rgba(90,70,95,0.16);}
.head{font-size:52px;font-weight:900;line-height:1.34;color:#1a1420;margin-top:30px;}
.head .em{color:#6b3f8f;}
.shotwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:34px;}
.shot{height:100%;border-radius:26px;overflow:hidden;border:1px solid rgba(90,70,95,0.26);box-shadow:0 22px 54px rgba(60,40,70,0.26);}
.shot img{height:100%;display:block;}
/* CSS 标注：教程类要指「看这里」时，别去裁一个放大图 ——
   裁不好就是把主体切一半（踩过）。在完整截图上叠标记，图完整、指向也清楚。
   .mark 用百分比定位，换图只需重调百分比。 */
.shot{position:relative;}
.mark{position:absolute;transform:translate(-50%,-50%);font-family:'Noto Sans SC','PingFang SC',sans-serif;
  font-size:26px;font-weight:700;letter-spacing:0.06em;color:#fff;padding:10px 20px;border-radius:999px;
  white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.45);}
.mark.hi{background:#c2472f;}
.mark.lo{background:#3d6fa8;}
/* 横构图截图放进竖版 slide，图和 foot 之间必然空一块 ——
   用这段解读把它撑满。竖构图截图铺满高度时，把整个 .note 删掉。 */
.note{font-size:34px;line-height:1.75;color:#4a4348;margin-top:30px;}
.note .em{color:#6b3f8f;font-weight:500;}
.foot{margin-top:34px;padding-top:22px;border-top:1px solid rgba(90,70,95,0.18);display:flex;justify-content:space-between;align-items:center;
  font-family:'Noto Sans SC','PingFang SC',sans-serif;font-size:26px;color:#9e8a99;letter-spacing:0.1em;}
</style></head><body><div class="frame">
<div class="kicker">报告怎么读 · 02</div>
<div class="head">第一步：把<span class="em">最高和最低</span>那两个角找出来</div>
<div class="shotwrap"><div class="shot"><img src="assets/radar.png"/><div class="mark hi" style="left:64%;top:87%">最高 85</div><div class="mark lo" style="left:13%;top:47%">最低 60</div></div></div>
<div class="note">我这张最高是边缘系统 85，最低是小脑 60，差 <span class="em">25 分</span>。差得越多，这两件事在你身上的省力和费力就越明显。</div>
<div class="foot"><span>灵伴 AI · 天赋脑图</span><span>八个维度 · 只用记两个</span></div>
</div></body></html>
